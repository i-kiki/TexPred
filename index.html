<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArchitectAI Restorer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
<style>
  :root {
    --bg: #F7F4EF; --text: #4A3E3D; --head: #5C4033;
    --btn: #D2B48C; --btn-h: #C19A6B; --viewer: #EFECE6;
    --line: #e3dccf; --card: #fffdf9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Source Sans Pro", -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6; font-size: 16px;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 56px 24px 80px; }
  h1, h2, h3 { color: var(--head); font-family: Georgia, serif; font-weight: 700; margin: 0; }
  h1 { font-size: 2.6rem; padding: 0 0 1.2rem; line-height: 1.2; }
  h2 { font-size: 1.75rem; padding: .6rem 0 1rem; }
  h3 { font-size: 1.4rem; padding: .5rem 0 .8rem; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } main { padding-top: 32px; } h1 { font-size: 2rem; } }

  label.lbl { display: block; font-size: 14px; margin-bottom: 6px; }
  .drop {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: #efe9de; border: 1px dashed #cdbfa6; border-radius: 8px;
    padding: 16px; cursor: pointer; transition: background .15s;
  }
  .drop.over { background: #e8dfcd; }
  .drop .ico { font-size: 28px; }
  .drop small { display: block; opacity: .7; }
  .browse {
    margin-left: auto; background: var(--card); border: 1px solid var(--line);
    padding: 6px 14px; border-radius: 8px; font: inherit; color: var(--text); cursor: pointer;
  }
  .browse:hover { border-color: var(--btn-h); color: var(--head); }
  #file { display: none; }
  #preview { margin-top: 16px; }
  #preview img { width: 100%; border-radius: 4px; display: block; }
  #preview .cap { font-size: 14px; opacity: .7; margin-top: 6px; }
  .filechip { margin-top: 10px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .filechip button { background: none; border: 0; color: var(--text); cursor: pointer; font-size: 16px; }

  select {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  }
  select:focus { outline: 2px solid var(--btn); }
  .sel { margin-top: 18px; }

  button.primary {
    background: var(--btn); color: #fff; font-weight: bold; border: 1px solid transparent;
    border-radius: 8px; padding: 10px 20px; font-size: 16px; cursor: pointer; font-family: inherit;
  }
  button.primary:hover { background: var(--btn-h); }
  button.primary:disabled { opacity: .6; cursor: wait; }

  .alert { padding: 14px 16px; border-radius: 8px; margin: 16px 0; font-size: 16px; }
  .alert.err  { background: #f6dcd8; color: #7d2a20; }
  .alert.ok   { background: #dfeadb; color: #2f5a2b; }
  .alert.info { background: #e4ebf0; color: #2c4a63; }
  .alert.warn { background: #f5ecce; color: #6b5712; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 26px 0 10px; }

  .spinner { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
  .spinner i {
    width: 20px; height: 20px; border: 3px solid var(--line); border-top-color: var(--btn-h);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #viewer { width: 100%; height: 350px; background: var(--viewer); border-radius: 8px; margin-top: 14px; overflow: hidden; }
  #viewer canvas { display: block; }
  .dl { margin-top: 12px; }
  .hidden { display: none !important; }
  footer { margin-top: 48px; font-size: 13px; opacity: .6; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>🏛️ ArchitectAI: Рабочая ИИ-Реставрация</h1>

  <div class="cols">
    <section>
      <h2>1. Загрузка фотографии</h2>
      <label class="lbl">Загрузите фото здания</label>
      <div class="drop" id="drop">
        <span class="ico">☁️</span>
        <div>Перетащите файл сюда<small>JPG, JPEG, PNG, JFIF</small></div>
        <button type="button" class="browse" id="browse">Выбрать файл</button>
      </div>
      <input type="file" id="file" accept=".jpg,.jpeg,.png,.jfif,image/*">
      <div id="preview" class="hidden">
        <div class="filechip"><span id="fname"></span><button id="clear" title="Удалить">✕</button></div>
        <img id="img" alt="Загруженное здание">
        <div class="cap">Загруженное здание</div>
      </div>

      <div class="sel">
        <label class="lbl" for="style">Выбор режима стиля:</label>
        <select id="style">
          <option>Автоматическое определение ИИ</option>
          <option>Готика</option>
          <option>Барокко</option>
          <option>Классицизм</option>
        </select>
      </div>
    </section>

    <section>
      <h2>2. Результат анализа ИИ</h2>
      <button class="primary" id="run">Запустить анализ здания</button>
      <div id="out"></div>
    </section>
  </div>

  <footer>ArchitectAI · демо-версия в браузере (без сервера)</footer>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';

const $ = id => document.getElementById(id);
const fileInput = $('file'), drop = $('drop'), out = $('out');
let file = null, imgEl = null, renderer = null, rafId = 0;

/* ---------- загрузка файла ---------- */
function setFile(f) {
  if (!f) return;
  file = f;
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => { imgEl = im; };
  im.src = url;
  $('img').src = url;
  $('fname').textContent = f.name + ' (' + (f.size / 1024).toFixed(1) + ' KB)';
  $('preview').classList.remove('hidden');
}
$('browse').onclick = e => { e.stopPropagation(); fileInput.click(); };
drop.onclick = () => fileInput.click();
fileInput.onchange = () => setFile(fileInput.files[0]);
$('clear').onclick = () => {
  file = imgEl = null; fileInput.value = '';
  $('preview').classList.add('hidden');
};
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

/* ---------- «ИИ»: анализ изображения (демо-эвристика) ---------- */
function analyze(im) {
  const S = 96, c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(im, 0, 0, S, S);
  const d = ctx.getImageData(0, 0, S, S).data;
  const g = new Float32Array(S * S);
  let warm = 0, hash = 2166136261;
  for (let i = 0; i < S * S; i++) {
    const r = d[i * 4], gg = d[i * 4 + 1], b = d[i * 4 + 2];
    g[i] = 0.3 * r + 0.59 * gg + 0.11 * b;
    warm += (r - b) / 255;
    hash = Math.imul(hash ^ (g[i] | 0), 16777619) >>> 0;
  }
  let gx = 0, gy = 0, sym = 0;
  for (let y = 1; y < S - 1; y++) for (let x = 1; x < S - 1; x++) {
    gx += Math.abs(g[y * S + x + 1] - g[y * S + x - 1]);   // вертикальные линии
    gy += Math.abs(g[(y + 1) * S + x] - g[(y - 1) * S + x]); // горизонтальные линии
  }
  for (let y = 0; y < S; y++) for (let x = 0; x < S / 2; x++)
    sym += Math.abs(g[y * S + x] - g[y * S + (S - 1 - x)]);
  const n = S * S;
  const edge = (gx + gy) / n, vert = gx / (gx + gy + 1e-6);
  sym = 1 - sym / (n / 2) / 255;
  warm /= n;
  // баллы стилей
  const sc = {
    Gothic:     vert * 2.2 + (edge / 40) * 0.6 - warm * 0.5,
    Baroque:    (edge / 40) * 1.4 + warm * 1.6 + (1 - sym) * 0.6,
    Classicism: sym * 1.8 + (1 - vert) * 1.2 - (edge / 40) * 0.3
  };
  const ex = Object.fromEntries(Object.entries(sc).map(([k, v]) => [k, Math.exp(v * 2.2)]));
  const sum = Object.values(ex).reduce((a, b) => a + b, 0);
  const pr = Object.entries(ex).map(([k, v]) => [k, v / sum * 100]).sort((a, b) => b[1] - a[1]);
  return { style: pr[0][0], conf: pr[0][1], hash };
}

const RU = { Gothic: 'Готика', Baroque: 'Барокко', Classicism: 'Классицизм' };
const KEY = { 'Готика': 'Gothic', 'Барокко': 'Baroque', 'Классицизм': 'Classicism' };

/* ---------- «ИИ»: 3D-генерация (процедурно) ---------- */
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = Math.imul(s ^ (s >>> 15), 2246822519) + 0x9e3779b9 >>> 0) / 4294967296; }

function buildPoints(style, seed) {
  const r = rng(seed), pts = [];
  const add = (x, y, z) => pts.push(new THREE.Vector3(x, y, z));
  const w = 2.4 + r() * 0.6, dp = 1.6 + r() * 0.5, h = 2.2 + r() * 0.6;
  // основной объём
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) { add(sx * w, 0, sz * dp); add(sx * w, h, sz * dp); }
  if (style === 'Gothic') {
    const top = h + 2.8 + r();
    add(0, top, 0);                                   // шпиль
    for (const sx of [-1, 1]) { add(sx * w * 0.8, h + 1.4, 0); add(sx * w, h + 0.9, -dp * 0.6); } // башни
    add(0, h + 1.2, dp);
  } else if (style === 'Baroque') {
    for (let i = 0; i < 10; i++) {                    // купол
      const a = i / 10 * Math.PI * 2;
      add(Math.cos(a) * w * 0.8, h + 0.4, Math.sin(a) * dp * 0.8);
      add(Math.cos(a) * w * 0.45, h + 1.3, Math.sin(a) * dp * 0.45);
    }
    add(0, h + 2.1, 0);
    for (const sx of [-1, 1]) add(sx * (w + 0.5), h * 0.6, dp + 0.5 + r() * 0.3); // выступы
  } else {
    add(0, h + 1.1, dp * 0.9); add(0, h + 1.1, -dp * 0.9); // фронтон
    for (const sx of [-1, 1]) { add(sx * w * 0.7, 0, dp + 0.9); add(sx * w * 0.7, h, dp + 0.9); } // портик
  }
  for (let i = 0; i < 30; i++) add((r() - .5) * 2 * w, r() * h, (r() - .5) * 2 * dp); // «шум сети»
  return pts;
}

function toOBJ(geo) {
  const p = geo.attributes.position, lines = ['# ArchitectAI restored_building.obj'];
  for (let i = 0; i < p.count; i++) lines.push(`v ${p.getX(i).toFixed(5)} ${p.getY(i).toFixed(5)} ${p.getZ(i).toFixed(5)}`);
  for (let i = 0; i < p.count; i += 3) lines.push(`f ${i + 1} ${i + 2} ${i + 3}`);
  return lines.join('\n');
}

function showViewer(geo) {
  const box = $('viewer');
  cancelAnimationFrame(rafId);
  if (renderer) { renderer.dispose(); box.innerHTML = ''; }
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xEFECE6);
  const cam = new THREE.PerspectiveCamera(45, box.clientWidth / box.clientHeight, 0.1, 1000);
  cam.position.set(7, 5, 9);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(box.clientWidth, box.clientHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  box.appendChild(renderer.domElement);
  const ctl = new OrbitControls(cam, renderer.domElement);
  ctl.enableDamping = true; ctl.target.set(0, 2, 0); ctl.autoRotate = true; ctl.autoRotateSpeed = 1.2;
  scene.add(new THREE.AmbientLight(0x666666));
  const dl = new THREE.DirectionalLight(0xffffff, 2.2);
  dl.position.set(5, 10, 7); scene.add(dl);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: 0xD2B48C, roughness: .6, metalness: .1, side: THREE.DoubleSide, flatShading: true }));
  scene.add(mesh);
  scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25),
    new THREE.LineBasicMaterial({ color: 0x8a6a50 })));
  const loop = () => { rafId = requestAnimationFrame(loop); ctl.update(); renderer.render(scene, cam); };
  loop();
  addEventListener('resize', () => {
    cam.aspect = box.clientWidth / box.clientHeight; cam.updateProjectionMatrix();
    renderer.setSize(box.clientWidth, box.clientHeight);
  });
}

/* ---------- кнопка «Запустить анализ» ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const msg = (cls, html) => `<div class="alert ${cls}">${html}</div>`;
const spin = t => `<div class="spinner"><i></i><span>${t}</span></div>`;

$('run').onclick = async () => {
  if (!file || !imgEl) { out.innerHTML = msg('err', 'Пожалуйста, загрузите фотографию здания!'); return; }
  const btn = $('run'); btn.disabled = true;
  const opt = $('style').value;
  const res = analyze(imgEl);
  let style = KEY[opt] || res.style;
  let html = '';

  if (!KEY[opt]) {
    out.innerHTML = spin('Нейросеть анализирует стиль...');
    await sleep(900);
    html = msg('ok', `🧠 ИИ определил стиль: <b>${RU[res.style]}</b> (Уверенность: ${res.conf.toFixed(2)}%)`);
  } else {
    html = msg('info', `Вы вручную установили стиль: <b>${opt}</b>`);
  }
  out.innerHTML = html + '<hr><h3>🛠️ 3D-Реставрация фасада</h3>' + spin('Нейросеть Reconstruction3DNet генерирует 3D геометрию здания...');
  await sleep(1200);

  try {
    const geo = new ConvexGeometry(buildPoints(style, res.hash)).toNonIndexed();
    geo.computeVertexNormals();
    const obj = toOBJ(geo);
    const url = URL.createObjectURL(new Blob([obj], { type: 'model/obj' }));
    out.innerHTML = html + '<hr><h3>🛠️ 3D-Реставрация фасада</h3>' +
      msg('ok', '🎉 3D-модель успешно построена!') +
      `<a class="dl" href="${url}" download="restored_architecture.obj"><button class="primary" type="button">📥 Скачать восстановленную модель (.OBJ)</button></a>` +
      '<div id="viewer"></div>';
    renderer = null;
    showViewer(geo);
  } catch (e) {
    out.innerHTML = html + '<hr>' + msg('err', 'Ошибка в процессе 3D-генерации: ' + e.message);
  }
  btn.disabled = false;
};
</script>
</body>
</html>
